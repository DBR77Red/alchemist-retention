kind = "web"
previewPath = "/"
title = "Retention Alchemist"
version = "1.0.0"
id = "artifacts/retention-alchemist"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19769

[services.development]
run = "pnpm --filter @workspace/retention-alchemist run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/retention-alchemist", "run", "build" ]
publicDir = "artifacts/retention-alchemist/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19769"
BASE_PATH = "/"
